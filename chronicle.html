<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Training Log — Entity Sector</title>
<meta name="description" content="Log today's physical and spiritual Wins and Wipeouts, or backfill any day gone by.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23D4AF37'/%3E%3Ccircle cx='50' cy='50' r='30' fill='%23B91C1C'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body class="theme-entity">
<div id="bgwash">
  <div class="sun" aria-hidden="true"></div>
  <div class="horizon-grid" aria-hidden="true"></div>
  <div class="waves-fg" aria-hidden="true">
    <svg viewBox="0 0 400 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path class="wave-layer w2" d="M0,30 Q50,10 100,30 T200,30 T300,30 T400,30 V60 H0 Z" fill="#1f130c" opacity="0.85"/>
      <path class="wave-layer" d="M0,40 Q50,22 100,40 T200,40 T300,40 T400,40 V60 H0 Z" fill="#2B1B12" opacity="0.95"/>
    </svg>
  </div>
</div>
<div id="toastLayer"></div>

<nav class="navbar">
  <a class="nav-link" href="index.html">🏠 HQ</a>
  <a class="nav-link" href="entity-arena.html">🏛️ Arena</a>
  <a class="nav-link active" href="chronicle.html">⚔️ Training</a>
  <a class="nav-link" href="honors.html">🏅 Medals</a>
</nav>

<div class="wrap">
  <header class="hero-compact">
    <div class="sector-emblem" aria-hidden="true"><span class="emblem-icon">⚔️</span></div>
    <div>
      <h1 class="title">Training Log</h1>
      <div class="subtitle">Body and spirit, logged day by day</div>
    </div>
  </header>

  <div class="scoreboard">
    <div class="score-tile"><div class="num" id="scoreToday">0</div><div class="lbl">Today</div></div>
    <div class="score-tile"><div class="num" id="scoreWeek">0</div><div class="lbl">This Week</div></div>
    <div class="score-tile"><div class="num" id="scoreAllTime">0</div><div class="lbl">All-Time</div></div>
  </div>

  <!-- DATE NAVIGATOR -->
  <div class="panel">
    <div class="ribbon">Choose a Day</div>
    <div class="datenav">
      <button class="btn ghost small" id="prevDayBtn">‹</button>
      <div class="cur-date" id="curDateLabel">Today</div>
      <button class="btn ghost small" id="nextDayBtn">›</button>
      <input type="date" id="datePicker">
    </div>
    <div class="lock-badge" id="lockBadge" style="display:none;">🔒 Sealed — this day is locked and read-only</div>
    <div style="text-align:center; margin-top:10px;">
      <button class="btn secondary small" id="lockDayBtn">Lock This Day's Score</button>
    </div>
  </div>

  <div class="panel">
    <div class="ribbon">Wins</div>
    <div id="deedsList"></div>
  </div>
  <div class="panel">
    <div class="ribbon pink-ribbon">Wipeouts</div>
    <div id="viceList"></div>
  </div>
  <div class="panel">
    <div class="ribbon">Today's Session Log</div>
    <div id="chronicleLog"></div>
  </div>

  <footer>
    ZERV LEVEL UP &middot; Entity Sector &middot; all data lives only in this browser (localStorage)
  </footer>
</div>

<script src="app.js"></script>
<script>
/* =========================================================================
   Page state
   ========================================================================= */
let selectedDate = todayStr();

function render(){
  renderScoreboard();
  renderDateNav();
  renderDeeds();
  renderVices();
  renderChronicleLog();
}

function renderDateNav(){
  const t = todayStr();
  document.getElementById("curDateLabel").textContent =
    selectedDate === t ? `Today — ${selectedDate}` : selectedDate;
  document.getElementById("datePicker").value = selectedDate;
  document.getElementById("datePicker").max = t;
  document.getElementById("nextDayBtn").disabled = selectedDate >= t;
  const day = getDay(selectedDate);
  document.getElementById("lockBadge").style.display = day.locked ? "flex" : "none";
  document.getElementById("lockDayBtn").disabled = day.locked;
  document.getElementById("lockDayBtn").textContent = day.locked ? "🔒 Sealed" : "Lock This Day's Score";
}

function renderDeeds(){
  const el = document.getElementById("deedsList");
  el.innerHTML = "";
  const day = getDay(selectedDate);
  const locked = day.locked;
  for(const d of DEEDS){
    const card = document.createElement("div");
    card.className = "row-card";
    const pts = dayDeedPoints(day, d.id);
    let body = "";
    if(d.type === "flat"){
      const on = day.deeds[d.id] && day.deeds[d.id].on;
      body = `<div class="tier-row">
        <button class="btn ${on?'secondary':''} small" ${locked?'disabled':''} onclick="toggleFlatDeed('${d.id}')">${on?'✓ Logged':'Log +'+d.points}</button>
      </div>`;
    } else if(d.type === "tiered"){
      const cur = day.deeds[d.id];
      body = `<div class="tier-row">` + d.tiers.map(t => {
        const active = cur && cur.n === t.n;
        return `<button class="tier-btn ${active?'active':''}" ${locked?'disabled':''} onclick="setTieredDeed('${d.id}',${t.n})">${t.label} · +${t.points}</button>`;
      }).join("") + (cur ? `<button class="tier-btn" ${locked?'disabled':''} onclick="clearTieredDeed('${d.id}')">clear</button>` : "") + `</div>`;
    }
    card.innerHTML = `
      <div class="row-head">
        <div class="row-title"><span class="row-icon">${d.icon}</span>${d.name}</div>
        <div class="row-points ${pts>0?'':'zero'}">${pts>0?'+':''}${pts}</div>
      </div>
      ${body}`;
    el.appendChild(card);
  }
}

function renderVices(){
  const el = document.getElementById("viceList");
  el.innerHTML = "";
  const day = getDay(selectedDate);
  const locked = day.locked;
  for(const v of VICES){
    const card = document.createElement("div");
    card.className = "row-card";
    const pts = dayVicePoints(day, v.id);
    let body = "";
    if(v.type === "stacking"){
      const count = (day.vices[v.id] && day.vices[v.id].count) || 0;
      body = `<div class="tier-row">
        <button class="tier-btn" ${locked?'disabled':''} onclick="incStackingVice('${v.id}',1)">+ Log (${v.points})</button>
        ${count>0?`<button class="tier-btn" ${locked?'disabled':''} onclick="incStackingVice('${v.id}',-1)">− Undo</button><span class="muted" style="align-self:center;">×${count}</span>`:""}
      </div>`;
    } else if(v.type === "tiered_count"){
      const count = (day.vices[v.id] && day.vices[v.id].count) || 0;
      body = `<div class="tier-row">
        <button class="tier-btn" ${locked?'disabled':''} onclick="incStackingVice('${v.id}',1)">+ Log occurrence</button>
        ${count>0?`<button class="tier-btn" ${locked?'disabled':''} onclick="incStackingVice('${v.id}',-1)">− Undo</button><span class="muted" style="align-self:center;">×${count}</span>`:""}
      </div>`;
    } else if(v.type === "amount_each"){
      const entries = (day.vices[v.id] && day.vices[v.id].entries) || [];
      body = `<div class="purchase-input">
        <input type="number" min="0" step="1" id="purchaseAmt" placeholder="Amount ($)" ${locked?'disabled':''}>
        <button class="btn small danger" ${locked?'disabled':''} onclick="logPurchase()">Log</button>
      </div>${entries.length?`<div class="muted" style="margin-top:6px;">${entries.length} purchase${entries.length===1?'':'s'} logged today</div>`:""}`;
    }
    card.innerHTML = `
      <div class="row-head">
        <div class="row-title"><span class="row-icon">${v.icon}</span>${v.name}</div>
        <div class="row-points ${pts<0?'neg':'zero'}">${pts}</div>
      </div>
      ${body}`;
    el.appendChild(card);
  }
}

function renderChronicleLog(){
  const el = document.getElementById("chronicleLog");
  el.innerHTML = "";
  const day = getDay(selectedDate);
  const locked = day.locked;
  const items = [];

  for(const d of DEEDS){
    const rec = day.deeds[d.id];
    if(!rec) continue;
    if(d.type === "flat" && rec.on){
      items.push({ label:`${d.icon} ${d.name}`, points:d.points, pos:true, remove:()=>toggleFlatDeed(d.id) });
    } else if(d.type === "tiered" && rec.n){
      const t = d.tiers.find(t=>t.n===rec.n);
      items.push({ label:`${d.icon} ${d.name} (${t.label})`, points:rec.points, pos:true, remove:()=>clearTieredDeed(d.id) });
    }
  }
  for(const v of VICES){
    const rec = day.vices[v.id];
    if(!rec) continue;
    if(v.type === "stacking" && rec.count){
      for(let i=0;i<rec.count;i++){
        items.push({ label:`${v.icon} ${v.name}`, points:v.points, pos:false, remove:()=>incStackingVice(v.id,-1) });
      }
    } else if(v.type === "tiered_count" && rec.count){
      items.push({ label:`${v.icon} ${v.name} (×${rec.count})`, points:dayVicePoints(day,v.id), pos:false, remove:()=>incStackingVice(v.id,-1) });
    } else if(v.type === "amount_each"){
      (rec.entries||[]).forEach((e,i) => {
        items.push({ label:`${v.icon} Purchase ($${e.amount})`, points:e.points, pos:false, remove:()=>removePurchase(i) });
      });
    }
  }

  if(items.length === 0){
    el.innerHTML = `<div class="chronicle-empty">No Wins or Wipeouts recorded for this day yet.</div>`;
    return;
  }
  for(const it of items){
    const row = document.createElement("div");
    row.className = "chronicle-item";
    row.innerHTML = `<span>${it.label}</span>
      <span style="display:flex;align-items:center;gap:8px;">
        <span class="pts ${it.pos?'pos':'neg'}">${it.pos?'+':''}${it.points}</span>
        ${locked?'':'<button class="x-btn" title="remove">×</button>'}
      </span>`;
    if(!locked){
      row.querySelector(".x-btn").onclick = it.remove;
    }
    el.appendChild(row);
  }
}

/* =========================================================================
   LOGGING ACTIONS
   ========================================================================= */
function guardLocked(){
  if(getDay(selectedDate).locked){ showToast("🔒 This day is sealed and cannot be edited."); return true; }
  return false;
}
function afterMutation(){
  checkAndUnlockAchievements();
  render();
}

function toggleFlatDeed(id){
  if(guardLocked()) return;
  const day = getDay(selectedDate);
  const def = deedDef(id);
  const wasOn = day.deeds[id] && day.deeds[id].on;
  day.deeds[id] = { on: !wasOn };
  saveDay(selectedDate);
  popupAt((wasOn?"-":"+")+def.points, !wasOn);
  afterMutation();
}
function setTieredDeed(id, n){
  if(guardLocked()) return;
  const day = getDay(selectedDate);
  const def = deedDef(id);
  const prevPoints = dayDeedPoints(day, id);
  const t = def.tiers.find(t=>t.n===n);
  day.deeds[id] = { n, points: t.points };
  saveDay(selectedDate);
  const delta = t.points - prevPoints;
  if(delta !== 0) popupAt((delta>0?"+":"")+delta, delta>0);
  afterMutation();
}
function clearTieredDeed(id){
  if(guardLocked()) return;
  const day = getDay(selectedDate);
  delete day.deeds[id];
  saveDay(selectedDate);
  afterMutation();
}

function incStackingVice(id, delta){
  if(guardLocked()) return;
  const day = getDay(selectedDate);
  if(!day.vices[id]) day.vices[id] = { count:0 };
  const prevPoints = dayVicePoints(day, id);
  day.vices[id].count = Math.max(0, day.vices[id].count + delta);
  saveDay(selectedDate);
  const newPoints = dayVicePoints(day, id);
  const d2 = newPoints - prevPoints;
  if(d2 !== 0) popupAt(String(d2), d2>0);
  afterMutation();
}
function logPurchase(){
  if(guardLocked()) return;
  const input = document.getElementById("purchaseAmt");
  const amount = Number(input.value);
  if(!amount || amount <= 0) return;
  const day = getDay(selectedDate);
  const def = viceDef("purchases");
  const points = amountPoints(def.ranges, amount);
  if(!day.vices.purchases) day.vices.purchases = { entries: [] };
  day.vices.purchases.entries.push({ amount, points });
  saveDay(selectedDate);
  popupAt(String(points), false);
  afterMutation();
}
function removePurchase(index){
  if(guardLocked()) return;
  const day = getDay(selectedDate);
  if(day.vices.purchases && day.vices.purchases.entries) day.vices.purchases.entries.splice(index,1);
  saveDay(selectedDate);
  afterMutation();
}

function lockSelectedDay(){
  const day = getDay(selectedDate);
  if(day.locked) return;
  if(!confirm(`Seal ${selectedDate}? Once locked, this day can no longer be edited.`)) return;
  day.locked = true;
  saveDay(selectedDate);
  showToast("🔒 Day sealed.");
  afterMutation();
}

/* =========================================================================
   DATE NAVIGATION
   ========================================================================= */
function goToDate(d){
  const t = todayStr();
  if(d > t) d = t;
  selectedDate = d;
  render();
}
document.getElementById("prevDayBtn").onclick = () => goToDate(addDays(selectedDate, -1));
document.getElementById("nextDayBtn").onclick = () => goToDate(addDays(selectedDate, 1));
document.getElementById("datePicker").onchange = (e) => { if(e.target.value) goToDate(e.target.value); };
document.getElementById("lockDayBtn").onclick = lockSelectedDay;

/* =========================================================================
   INIT
   ========================================================================= */
checkAndUnlockAchievements();
render();
initSceneInteractivity();
</script>
</body>
</html>
