<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Explore the Beach — ZERV LEVEL UP</title>
<meta name="description" content="Walk the shoreline around your Surf Shack, in 3D.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%2300FF41'/%3E%3Ccircle cx='50' cy='50' r='30' fill='%23FF006E'/%3E%3Ccircle cx='50' cy='50' r='14' fill='%23FFBE0B'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<style>
  /* This page is a full-screen 3D viewport, not a scrolling panel page. */
  html, body{ height:100%; overflow:hidden; overscroll-behavior:none; }
  #bgwash, .wrap{ display:none !important; } /* the 2D ambient background is replaced by the 3D scene itself */
  #three-canvas{ position:fixed; inset:0; z-index:0; display:block; touch-action:none; }

  #explore-ui{ position:fixed; inset:0; z-index:5; pointer-events:none; font-family:'Poppins',sans-serif; }
  #explore-ui > *{ pointer-events:auto; }

  .explore-topbar{
    position:absolute; top:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between;
    padding: max(12px, env(safe-area-inset-top)) 12px 10px;
    background: linear-gradient(180deg, rgba(10,10,20,0.65), transparent);
  }
  .back-chip{
    display:inline-flex; align-items:center; gap:6px; text-decoration:none;
    background: rgba(26,26,46,0.75); border:2px solid var(--zerv-border); color: var(--zerv-text);
    font-family:'Bungee', sans-serif; font-size:11px; padding:9px 14px; border-radius:20px;
    backdrop-filter: blur(6px);
  }
  .stat-chip{
    background: rgba(26,26,46,0.75); border:2px solid var(--zerv-border); color: var(--zerv-heading);
    font-family:'Bungee', sans-serif; font-size:11px; padding:9px 14px; border-radius:20px;
    backdrop-filter: blur(6px); text-align:right; line-height:1.5;
  }
  .stat-chip small{ display:block; color: var(--zerv-text); font-family:'Poppins',sans-serif; font-size:9px; opacity:0.8; }

  #loadingNotice{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px;
    background: var(--zerv-bg); color: var(--zerv-heading); font-family:'Bungee', sans-serif; font-size:14px; z-index:10;
  }
  #loadingNotice .sub{ font-family:'Poppins',sans-serif; color: var(--zerv-text); font-size:11px; opacity:0.85; }

  /* Virtual joystick (also mouse-draggable, so it works for desktop too) */
  #joystick-zone{
    position:absolute; left:18px; bottom: max(24px, env(safe-area-inset-bottom));
    width:110px; height:110px; border-radius:50%;
    background: rgba(26,26,46,0.45); border:2px solid var(--zerv-border);
  }
  #joystick-nub{
    position:absolute; left:50%; top:50%; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%;
    background: var(--btn-primary-bg); border:2px solid var(--btn-primary-border);
    transition: transform .05s linear;
  }
  #look-hint{
    position:absolute; right:18px; bottom: max(24px, env(safe-area-inset-bottom)); width:150px; text-align:right;
    color: var(--zerv-text); font-size:10px; opacity:0.75; font-family:'Poppins',sans-serif;
  }
</style>
</head>
<body>
<div id="bgwash"></div>
<div id="toastLayer"></div>

<canvas id="three-canvas"></canvas>

<div id="loadingNotice">
  <div class="zerv-badge" style="width:64px;height:64px;"></div>
  <div>Paddling out...</div>
  <div class="sub">Loading the shoreline</div>
</div>

<div id="explore-ui" style="display:none;">
  <div class="explore-topbar">
    <a class="back-chip" href="entrepreneur.html">🏖️ Back to Surf Shack</a>
    <div class="stat-chip" id="exploreStat">—<small>ZERV LEVEL UP</small></div>
  </div>
  <div id="joystick-zone"><div id="joystick-nub"></div></div>
  <div id="look-hint">Drag anywhere<br>else to look around</div>
</div>

<script src="app.js"></script>
<script type="module" src="beach-explore.js"></script>
</body>
</html>
