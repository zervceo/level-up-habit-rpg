<!doctype html>
<!--
  Arcade Jackpot FX — retro cabinet win sequence ending on a huge 3D gold
  money sign. Pure SVG + CSS (no JS, no external assets besides the Google
  Font import below) — drop this <svg>+<style> block into any ad unit, hero
  section, or video capture rig.

  This is a one-shot narrative (~6s), not an infinite loop: reels spin, WIN
  flashes, coins burst from the slot, then the gold "$" rises and holds
  (idle shimmer/sparkle/rotating specular highlight keep it alive forever
  after landing). Reload the page to replay from the top.

  Customizing:
    - Swap #marquee / #cabBody / #sky stop-colors for brand colors, or
      change the marquee text ("JACKPOT") to a brand name.
    - The #emboss filter (feSpecularLighting) is what gives the "$" its 3D
      metallic shine — reuse it on any shape for the same gold-coin look.
    - Timeline is keyframe-percentage based over 6s; nudge the % offsets in
      reelSpin / winPop / flash / coinFly / signRise to retime the beats.
    - To export as video: screen-record this page for ~7s starting from
      page load (e.g. headless Chromium + ffmpeg).
-->
<html>
<head>
<meta charset="utf-8">
<title>Arcade Jackpot FX</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0016;}
  svg{display:block;width:100vw;height:100vh}
  .pixel{font-family:'Press Start 2P',monospace}
</style>
</head>
<body>
<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0b3d"/>
      <stop offset="55%" stop-color="#3a0f5c"/>
      <stop offset="100%" stop-color="#0a0016"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a33"/>
      <stop offset="100%" stop-color="#05000d"/>
    </linearGradient>
    <linearGradient id="cabBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2a5c"/>
      <stop offset="100%" stop-color="#1b1233"/>
    </linearGradient>
    <linearGradient id="marquee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2fa0"/>
      <stop offset="100%" stop-color="#7d2fe0"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d0"/>
      <stop offset="100%" stop-color="#ffd23f"/>
    </radialGradient>
    <radialGradient id="burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d0" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#ffd23f" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffd23f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coinFill" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff6d0"/>
      <stop offset="55%" stop-color="#ffd23f"/>
      <stop offset="100%" stop-color="#a5670c"/>
    </radialGradient>
    <linearGradient id="goldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="30%" stop-color="#ffd23f"/>
      <stop offset="65%" stop-color="#e29a1f"/>
      <stop offset="100%" stop-color="#a5670c"/>
    </linearGradient>

    <!-- embossed-metal look: bump-map the shape's own alpha, light it, composite over the gold gradient -->
    <filter id="emboss" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="bump"/>
      <feSpecularLighting in="bump" surfaceScale="7" specularConstant="1.1" specularExponent="14"
        lighting-color="#fff8e0" result="spec">
        <animateTransform attributeName="transform" type="rotate" values="0 240 240;360 240 240"
          dur="5s" repeatCount="indefinite" additive="sum"/>
        <feDistantLight azimuth="235" elevation="55"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specClip"/>
      <feComposite in="SourceGraphic" in2="specClip" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>

    <clipPath id="screenClip">
      <rect x="350" y="290" width="380" height="320" rx="4"/>
    </clipPath>
  </defs>

  <!-- BACKDROP -->
  <rect width="1080" height="620" fill="url(#sky)"/>
  <circle class="sun" cx="540" cy="480" r="180" fill="#ff6fd8" opacity="0.25"/>
  <rect y="620" width="1080" height="460" fill="url(#floor)"/>
  <g stroke="#ff6fd8" stroke-width="2" opacity="0.35">
    <path d="M540,620 L60,1080"/><path d="M540,620 L220,1080"/><path d="M540,620 L380,1080"/>
    <path d="M540,620 L700,1080"/><path d="M540,620 L860,1080"/><path d="M540,620 L1020,1080"/>
    <path d="M300,680 L780,680"/><path d="M220,760 L860,760"/><path d="M110,860 L970,860"/>
    <path d="M0,1000 L1080,1000"/>
  </g>

  <!-- CABINET (shakes as a whole once the win lands) -->
  <g class="cabinetShake">

    <!-- base -->
    <rect x="300" y="780" width="480" height="220" rx="10" fill="url(#cabBody)" stroke="#00eaff" stroke-width="4"/>
    <!-- control panel -->
    <path d="M280,700 L800,700 L830,790 L250,790 Z" fill="#241a44" stroke="#00eaff" stroke-width="4"/>
    <circle cx="380" cy="745" r="26" fill="#111" stroke="#ff2fa0" stroke-width="5"/>
    <circle cx="380" cy="745" r="10" fill="#ff2fa0"/>
    <circle cx="470" cy="745" r="18" fill="#ffd23f" stroke="#000" stroke-width="3"/>
    <circle cx="520" cy="745" r="18" fill="#00eaff" stroke="#000" stroke-width="3"/>
    <circle cx="570" cy="745" r="18" fill="#7dff8f" stroke="#000" stroke-width="3"/>
    <rect x="640" y="730" width="80" height="34" rx="6" fill="#0a0016" stroke="#ffd23f" stroke-width="3"/>
    <rect x="660" y="742" width="40" height="8" rx="3" fill="#ffd23f"/>

    <!-- body / bezel -->
    <rect x="290" y="240" width="500" height="470" rx="18" fill="url(#cabBody)" stroke="#00eaff" stroke-width="5"/>
    <rect x="330" y="270" width="420" height="360" rx="10" fill="#050014" stroke="#ff6fd8" stroke-width="6"/>

    <!-- SCREEN CONTENTS -->
    <g clip-path="url(#screenClip)">
      <rect x="350" y="290" width="380" height="320" fill="#0a0022"/>
      <rect class="screenFlash" x="350" y="290" width="380" height="320" fill="url(#screenGlow)" opacity="0"/>

      <!-- idle / spin reels -->
      <g class="reels pixel" font-size="46" text-anchor="middle" fill="#ffd23f">
        <text x="450" y="470">7</text>
        <text x="540" y="470">7</text>
        <text x="630" y="470">7</text>
      </g>
      <text class="insertCoin pixel" x="540" y="580" text-anchor="middle" font-size="14" fill="#7dfcff">INSERT COIN</text>

      <text class="winText pixel" x="540" y="470" text-anchor="middle" font-size="56" fill="#ffd23f"
        stroke="#ff2fa0" stroke-width="3" paint-order="stroke" opacity="0">WIN!</text>
    </g>

    <!-- marquee -->
    <path d="M300,240 L780,240 L780,150 Q780,120 750,120 L330,120 Q300,120 300,150 Z"
      fill="url(#marquee)" stroke="#ffd23f" stroke-width="5"/>
    <text x="540" y="195" text-anchor="middle" class="pixel" font-size="34" fill="#fff">JACKPOT</text>
    <g class="bulbs" fill="#ffd23f">
      <circle cx="320" cy="130" r="6"/><circle cx="360" cy="122" r="6"/><circle cx="410" cy="118" r="6"/>
      <circle cx="465" cy="116" r="6"/><circle cx="540" cy="114" r="6"/><circle cx="615" cy="116" r="6"/>
      <circle cx="670" cy="118" r="6"/><circle cx="720" cy="122" r="6"/><circle cx="760" cy="130" r="6"/>
    </g>
  </g>

  <!-- COINS bursting from the slot -->
  <g class="coins">
    <circle class="coin c1" cx="680" cy="747" r="14" fill="url(#coinFill)" stroke="#a5670c" stroke-width="2"/>
    <circle class="coin c2" cx="680" cy="747" r="11" fill="url(#coinFill)" stroke="#a5670c" stroke-width="2"/>
    <circle class="coin c3" cx="680" cy="747" r="16" fill="url(#coinFill)" stroke="#a5670c" stroke-width="2"/>
    <circle class="coin c4" cx="680" cy="747" r="12" fill="url(#coinFill)" stroke="#a5670c" stroke-width="2"/>
    <circle class="coin c5" cx="680" cy="747" r="10" fill="url(#coinFill)" stroke="#a5670c" stroke-width="2"/>
    <circle class="coin c6" cx="680" cy="747" r="15" fill="url(#coinFill)" stroke="#a5670c" stroke-width="2"/>
    <circle class="coin c7" cx="680" cy="747" r="13" fill="url(#coinFill)" stroke="#a5670c" stroke-width="2"/>
    <circle class="coin c8" cx="680" cy="747" r="11" fill="url(#coinFill)" stroke="#a5670c" stroke-width="2"/>
  </g>

  <!-- THE PAYOFF: huge 3D gold money sign bursting out of the screen -->
  <g class="signRise">
    <g class="signIdle">
      <circle class="rays" cx="540" cy="440" r="430" fill="url(#burst)"/>
      <g class="sparkles" fill="#fff6d0">
        <path class="sp sp1" d="M360,260 l8,-26 8,26 26,8 -26,8 -8,26 -8,-26 -26,-8 z"/>
        <path class="sp sp2" d="M760,300 l6,-20 6,20 20,6 -20,6 -6,20 -6,-20 -20,-6 z"/>
        <path class="sp sp3" d="M300,560 l7,-22 7,22 22,7 -22,7 -7,22 -7,-22 -22,-7 z"/>
        <path class="sp sp4" d="M800,600 l7,-22 7,22 22,7 -22,7 -7,22 -7,-22 -22,-7 z"/>
        <path class="sp sp5" d="M540,180 l6,-18 6,18 18,6 -18,6 -6,18 -6,-18 -18,-6 z"/>
      </g>
      <g class="goldSign" font-family="'Arial Black', Arial, sans-serif" font-weight="900" text-anchor="middle">
        <g fill="#5c3a08"><text x="540" y="600" font-size="460" transform="translate(0,22)">$</text></g>
        <g fill="#7a4d0c"><text x="540" y="600" font-size="460" transform="translate(0,16)">$</text></g>
        <g fill="#96600f"><text x="540" y="600" font-size="460" transform="translate(0,10)">$</text></g>
        <g fill="#b57614"><text x="540" y="600" font-size="460" transform="translate(0,4)">$</text></g>
        <text x="540" y="600" font-size="460" fill="url(#goldFill)" filter="url(#emboss)"
          stroke="#5c3a08" stroke-width="3" paint-order="stroke">$</text>
      </g>
    </g>
  </g>
</svg>

<style>
  /* ---------- ambient, always running ---------- */
  .sun{ animation: sunPulse 3s ease-in-out infinite; }
  @keyframes sunPulse{ 0%,100%{opacity:.2} 50%{opacity:.32} }

  .bulbs circle{ animation: chase 1.1s steps(1) infinite; }
  .bulbs circle:nth-child(odd){ animation-delay: .0s; }
  .bulbs circle:nth-child(even){ animation-delay: .18s; }
  @keyframes chase{ 0%,49%{opacity:1} 50%,100%{opacity:.25} }

  /* ---------- narrative, plays once and holds ---------- */
  .reels{ animation: reelSpin 6s cubic-bezier(.2,.7,.2,1) 1 forwards; }
  @keyframes reelSpin{
    0%   { transform: scaleY(1);    opacity: 1; }
    18%  { transform: scaleY(.15);  opacity: .6; }
    38%  { transform: scaleY(1.2);  opacity: 1; }
    46%  { transform: scaleY(.15);  opacity: .6; }
    55%  { transform: scaleY(1);    opacity: 1; }
    62%  { transform: scale(1.15);  opacity: 1; }
    72%  { transform: scale(1.15);  opacity: 0; }
    100% { transform: scale(1.15);  opacity: 0; }
  }
  .insertCoin{ animation: blink 1s steps(1) infinite, fadeOutEarly 6s 1 forwards; }
  @keyframes blink{ 0%,50%{opacity:1} 51%,100%{opacity:0} }
  @keyframes fadeOutEarly{ 0%,45%{opacity:1} 55%,100%{opacity:0} }

  .winText{ animation: winPop 6s cubic-bezier(.2,.8,.3,1.4) 1 forwards; }
  @keyframes winPop{
    0%,58%   { opacity:0; transform: scale(.2); }
    64%      { opacity:1; transform: scale(1.3); }
    70%      { opacity:1; transform: scale(1); }
    82%      { opacity:1; transform: scale(1); }
    92%,100% { opacity:0; transform: scale(1); }
  }

  .screenFlash{ animation: flash 6s 1 forwards; }
  @keyframes flash{
    0%,57%  { opacity:0; }
    59%     { opacity:.9; }
    63%     { opacity:.2; }
    66%     { opacity:.8; }
    70%     { opacity:.1; }
    80%     { opacity: .7; }
    100%    { opacity: 1; }
  }

  .cabinetShake{ animation: shake 6s 1 forwards; }
  @keyframes shake{
    0%,60%   { transform: translate(0,0); }
    62%      { transform: translate(-6px,2px); }
    64%      { transform: translate(6px,-2px); }
    66%      { transform: translate(-5px,0); }
    68%      { transform: translate(5px,2px); }
    70%,100% { transform: translate(0,0); }
  }

  .coin{ opacity:0; animation: coinFly 6s cubic-bezier(.15,.7,.3,1) 1 forwards; }
  .c1{ --dx:-210px; --dy:-360px; --r:340deg; animation-delay:0s; }
  .c2{ --dx:-90px;  --dy:-430px; --r:-280deg; animation-delay:.05s; }
  .c3{ --dx:40px;   --dy:-460px; --r:300deg; animation-delay:.1s; }
  .c4{ --dx:170px;  --dy:-410px; --r:-320deg; animation-delay:.15s; }
  .c5{ --dx:260px;  --dy:-320px; --r:260deg; animation-delay:.2s; }
  .c6{ --dx:-260px; --dy:-260px; --r:-260deg; animation-delay:.08s; }
  .c7{ --dx:110px;  --dy:-330px; --r:300deg; animation-delay:.25s; }
  .c8{ --dx:-140px; --dy:-400px; --r:-300deg; animation-delay:.18s; }
  @keyframes coinFly{
    0%,58%  { opacity:0; transform: translate(0,0) rotate(0deg); }
    62%     { opacity:1; }
    80%     { opacity:1; transform: translate(var(--dx),var(--dy)) rotate(var(--r)); }
    100%    { opacity:0; transform: translate(var(--dx),calc(var(--dy) + 60px)) rotate(var(--r)); }
  }

  .signRise{
    transform-box: fill-box; transform-origin: 540px 440px;
    animation: signRise 6s cubic-bezier(.16,.8,.2,1.15) 1 forwards;
  }
  @keyframes signRise{
    0%,68%  { opacity:0; transform: scale(.15); }
    80%     { opacity:1; transform: scale(1.08); }
    90%     { opacity:1; transform: scale(.97); }
    100%    { opacity:1; transform: scale(1); }
  }
  .signIdle{ animation: idleWobble 5s ease-in-out infinite; transform-box: fill-box; transform-origin: 540px 440px; }
  @keyframes idleWobble{
    0%,100%{ transform: rotate(-2deg) translateY(0); }
    50%{ transform: rotate(2deg) translateY(-6px); }
  }
  .rays{ animation: raySpin 18s linear infinite; transform-box: fill-box; transform-origin: 540px 440px; }
  @keyframes raySpin{ from{transform:rotate(0)} to{transform:rotate(360deg)} }

  .sp{ transform-box: fill-box; transform-origin: center; animation: twinkle 1.6s ease-in-out infinite; }
  .sp1{ animation-delay: 0s } .sp2{ animation-delay: .3s } .sp3{ animation-delay: .6s }
  .sp4{ animation-delay: .9s } .sp5{ animation-delay: .45s }
  @keyframes twinkle{ 0%,100%{ transform:scale(.6); opacity:.3 } 50%{ transform:scale(1.15); opacity:1 } }
</style>
</body>
</html>
