  <div class="sun" aria-hidden="true"></div>

      <path class="wave-layer" d="M0,40 Q50,22 100,40 T200,40 T300,40 T400,40 V60 H0 Z" fill="#2B1B12" opacity="0.95"/>
    </svg>
  </div>

<nav class="navbar">
  <a class="nav-link" href="index.html">🏠 HQ</a>
  <a class="nav-link" href="entity-arena.html">🏛️ Arena</a>

<div class="wrap">
  <header class="hero-compact">
    <div class="sector-emblem" aria-hidden="true"><span class="emblem-icon">🏅</span></div>
    <div>
      <h1 class="title">Medals of Honor</h1>
      <div class="subtitle" id="honorsSummary">0 of 0 earned</div>
    </div>
  </header>

  <div class="panel">
    <div class="muted" style="margin-bottom:10px;">Medals span every sector — Entity, Entrepreneur, Education, and Elixir all feed this same wall of honor.</div>
    <div class="ach-grid" id="achGrid"></div>
  </div>

  <footer>
    ZERV LEVEL UP &middot; all data lives only in this browser (localStorage) &middot; nothing is ever sent anywhere
  </footer>
</div>

<script src="app.js"></script>
<script>
function renderAchievementsGrid(){
  const el = document.getElementById("achGrid");
  el.innerHTML = "";
  let earned = 0;
  for(const a of ACHIEVEMENTS){
    const unlocked = !!state.achievements[a.id];
    if(unlocked) earned++;
    const card = document.createElement("div");
    card.className = "ach-card" + (unlocked ? " unlocked" : "");
    card.innerHTML = `
      <div class="ach-icon">${a.icon}</div>
      <div class="ach-name">${a.name}</div>
      <div class="ach-desc">${a.desc}</div>
      ${unlocked ? `<div class="ach-date">Earned ${state.achievements[a.id]}</div>` : ""}`;
    el.appendChild(card);
  }
  document.getElementById("honorsSummary").textContent = `${earned} of ${ACHIEVEMENTS.length} earned`;
}

checkAndUnlockAchievements();
renderAchievementsGrid();
initSceneInteractivity();
</script>
</body>
</html>
