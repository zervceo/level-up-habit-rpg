<meta name="description" content="Every Honor of the Realm you've earned — and the ones still to come.">

<link rel="stylesheet" href="style.css">

<body>
<div id="bgwash">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="blob b4"></div><div class="blob b5"></div>
</div>
<div id="toastLayer"></div>

<nav class="navbar">
  <a class="nav-link" href="index.html">🏰 Dashboard</a>
  <a class="nav-link" href="chronicle.html">📜 Chronicle</a>
  <a class="nav-link active" href="honors.html">🏅 Honors</a>
</nav>

<div class="wrap">
  <header class="hero-compact">
    <div class="crest" aria-hidden="true"></div>
    <div>
      <h1 class="title">Honors of the Realm</h1>
      <div class="subtitle" id="honorsSummary">0 of 0 earned</div>
    </div>
  </header>

  <div class="panel">
    <div class="ach-grid" id="achGrid"></div>
  </div>

  <footer>
    Game of Life: Path to Knighthood &middot; all data lives only in this browser (localStorage) &middot; nothing is ever sent anywhere
  </footer>
</div>

<script src="app.js"></script>
<script>
function renderAchievementsGrid(){
  const el = document.getElementById("achGrid");
  el.innerHTML = "";
  let earned = 0;
  for(const a of ACHIEVEMENTS){
    const unlocked = !!state.achievements[a.id];
    if(unlocked) earned++;
    const card = document.createElement("div");
    card.className = "ach-card" + (unlocked ? " unlocked" : "");
    card.innerHTML = `
      <div class="ach-icon">${a.icon}</div>
      <div class="ach-name">${a.name}</div>
      <div class="ach-desc">${a.desc}</div>
      ${unlocked ? `<div class="ach-date">Earned ${state.achievements[a.id]}</div>` : ""}`;
    el.appendChild(card);
  }
  document.getElementById("honorsSummary").textContent = `${earned} of ${ACHIEVEMENTS.length} earned`;
}

checkAndUnlockAchievements();
renderAchievementsGrid();
</script>
</body>
</html>
